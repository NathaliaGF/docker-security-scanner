<svg xmlns="http://www.w3.org/2000/svg" width="1383" height="1056" viewBox="0 0 1383 1056" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#d4d4d4"><rect width="1383" height="1056" rx="10" fill="#1e1e1e"/><circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/><text x="20" y="48" xml:space="preserve" fill="#7ee787">$ dockerscan --file tests/samples/docker-compose.insecure.yml --severity HIGH</text><text x="20" y="68" xml:space="preserve"></text><text x="20" y="88" xml:space="preserve"><tspan>╔══════════════════════════════════════════════════════════╗</tspan></text><text x="20" y="108" xml:space="preserve"><tspan>║           DOCKER SECURITY SCANNER — RELATÓRIO            ║</tspan></text><text x="20" y="128" xml:space="preserve"><tspan>╚══════════════════════════════════════════════════════════╝</tspan></text><text x="20" y="148" xml:space="preserve"></text><text x="20" y="168" xml:space="preserve"><tspan> Arquivo: tests/samples/docker-compose.insecure.yml</tspan></text><text x="20" y="188" xml:space="preserve"><tspan>──────────────────────────────────────────────────────────</tspan></text><text x="20" y="208" xml:space="preserve"></text><text x="20" y="228" xml:space="preserve"><tspan> </tspan><tspan fill="#ff6b6b">[HIGH  ]</tspan><tspan> DC001 — Container running as root</tspan></text><text x="20" y="248" xml:space="preserve"><tspan>            Serviço: api</tspan></text><text x="20" y="268" xml:space="preserve"><tspan>            Linha:   8</tspan></text><text x="20" y="288" xml:space="preserve"><tspan>            Detalhe: No `user:` directive was found, or it is explicitly set to root. Running as root inside a container maximises the blast radius of a container escape.</tspan></text><text x="20" y="308" xml:space="preserve"><tspan>            Fix:     Add `user: 1000:1000` (or any non-root UID:GID) to the service definition.</tspan></text><text x="20" y="328" xml:space="preserve"><tspan>            Ref:     CIS Docker Benchmark 4.1: Ensure that a user for the container has been created</tspan></text><text x="20" y="348" xml:space="preserve"></text><text x="20" y="368" xml:space="preserve"><tspan> </tspan><tspan fill="#ff6b6b">[HIGH  ]</tspan><tspan> DC002 — Privileged port exposed to host (&lt; 1024)</tspan></text><text x="20" y="388" xml:space="preserve"><tspan>            Serviço: api</tspan></text><text x="20" y="408" xml:space="preserve"><tspan>            Linha:   12</tspan></text><text x="20" y="428" xml:space="preserve"><tspan>            Detalhe: Ports below 1024 are privileged. Binding one on the host can conflict with system services and may require elevated privileges to reconfigure.</tspan></text><text x="20" y="448" xml:space="preserve"><tspan>            Fix:     Use a non-privileged host port (&gt;= 1024), e.g. `8080:80`.</tspan></text><text x="20" y="468" xml:space="preserve"><tspan>            Ref:     CIS Docker Benchmark 5.7: Ensure that privileged ports are not mapped within containers</tspan></text><text x="20" y="488" xml:space="preserve"></text><text x="20" y="508" xml:space="preserve"><tspan> </tspan><tspan fill="#ff6b6b">[HIGH  ]</tspan><tspan> DC004 — Sensitive path mounted as volume</tspan></text><text x="20" y="528" xml:space="preserve"><tspan>            Serviço: api</tspan></text><text x="20" y="548" xml:space="preserve"><tspan>            Linha:   18</tspan></text><text x="20" y="568" xml:space="preserve"><tspan>            Detalhe: Mounting `/`, `/etc`, or `/var/run/docker.sock` grants the container privileged access to the host filesystem or the Docker daemon.</tspan></text><text x="20" y="588" xml:space="preserve"><tspan>            Fix:     Remove the dangerous mount. If the Docker socket is required (e.g., CI agents), use a socket proxy like `tecnativa/docker-socket-proxy`.</tspan></text><text x="20" y="608" xml:space="preserve"><tspan>            Ref:     CIS Docker Benchmark 5.5: Ensure sensitive host system directories are not mounted on containers</tspan></text><text x="20" y="628" xml:space="preserve"></text><text x="20" y="648" xml:space="preserve"><tspan> </tspan><tspan fill="#ff6b6b">[HIGH  ]</tspan><tspan> DC007 — `privileged: true` enabled</tspan></text><text x="20" y="668" xml:space="preserve"><tspan>            Serviço: api</tspan></text><text x="20" y="688" xml:space="preserve"><tspan>            Linha:   19</tspan></text><text x="20" y="708" xml:space="preserve"><tspan>            Detalhe: A privileged container has full access to the host kernel, all devices, and host namespaces — effectively root on the host machine.</tspan></text><text x="20" y="728" xml:space="preserve"><tspan>            Fix:     Remove `privileged: true` and use `cap_add` with only the specific capabilities the service actually needs.</tspan></text><text x="20" y="748" xml:space="preserve"><tspan>            Ref:     CIS Docker Benchmark 5.4: Ensure that privileged containers are not used</tspan></text><text x="20" y="768" xml:space="preserve"></text><text x="20" y="788" xml:space="preserve"><tspan> </tspan><tspan fill="#ff6b6b">[HIGH  ]</tspan><tspan> DC001 — Container running as root</tspan></text><text x="20" y="808" xml:space="preserve"><tspan>            Serviço: db</tspan></text><text x="20" y="828" xml:space="preserve"><tspan>            Linha:   25</tspan></text><text x="20" y="848" xml:space="preserve"><tspan>            Detalhe: No `user:` directive was found, or it is explicitly set to root. Running as root inside a container maximises the blast radius of a container escape.</tspan></text><text x="20" y="868" xml:space="preserve"><tspan>            Fix:     Add `user: 1000:1000` (or any non-root UID:GID) to the service definition.</tspan></text><text x="20" y="888" xml:space="preserve"><tspan>            Ref:     CIS Docker Benchmark 4.1: Ensure that a user for the container has been created</tspan></text><text x="20" y="908" xml:space="preserve"></text><text x="20" y="928" xml:space="preserve"><tspan>──────────────────────────────────────────────────────────</tspan></text><text x="20" y="948" xml:space="preserve"><tspan>RESUMO: 14 achados  |   HIGH: 5  |   MEDIUM: 6  |   LOW: 3</tspan></text><text x="20" y="968" xml:space="preserve"><tspan>Score de segurança: 0/100</tspan></text><text x="20" y="988" xml:space="preserve"><tspan>──────────────────────────────────────────────────────────</tspan></text><text x="20" y="1008" xml:space="preserve"></text><text x="20" y="1028" xml:space="preserve"></text></svg>