[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerscan"
version = "1.0.0"
description = "Static security scanner for Dockerfiles and docker-compose files, with SARIF output, an MCP server and validated AI auto-fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nathalia Gomes" }]
keywords = ["docker", "security", "devsecops", "sarif", "mcp", "cis-benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6.0", "colorama>=0.4.6"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7.0", "ruff>=0.5", "anthropic>=0.40", "mcp>=1.2"]

[project.scripts]
dockerscan = "dockerscan.cli:main"
dockerscan-mcp = "dockerscan.mcp_server:main"

[project.urls]
Homepage = "https://github.com/NathaliaGF/docker-security-scanner"

[tool.setuptools.packages.find]
include = ["dockerscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]
